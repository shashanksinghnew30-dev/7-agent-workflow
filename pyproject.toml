[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-7-agent-workflow"
version = "1.0.0"
description = "A production-grade, 7-Agent AI workflow featuring architectural debates, self-healing QA loopbacks, supervisor alignment, and dual CLI/Web UI."
authors = [{ name = "Senior AI/ML Engineer" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0"
]
